AWSTemplateFormatVersion: '2010-09-09'
Description: vox-brief — ECR repository (deploy once before main stack)

Resources:
  EcrRepo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: vox-brief-agent
      ImageScanningConfiguration:
        ScanOnPush: true
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [{
              "rulePriority": 1,
              "description": "Keep last 5 images",
              "selection": {
                "tagStatus": "any",
                "countType": "imageCountMoreThan",
                "countNumber": 5
              },
              "action": {"type": "expire"}
            }]
          }

Outputs:
  EcrUri:
    Description: Full ECR repository URI (append :tag for image references)
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrRepo}"
    Export:
      Name: vox-brief-ecr-uri
